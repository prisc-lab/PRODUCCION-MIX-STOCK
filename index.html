<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAR - Control de Stock</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #111111;
            --texto: #ffffff;
            --rojo: #ff0000;
            --gris: #333333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            color: var(--texto); 
            margin: 0; 
            padding: 10px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--rojo);
            margin-bottom: 20px;
            padding: 10px;
        }

        h1 { font-size: 1.2em; letter-spacing: 2px; margin: 0; }

        /* Contenedor de dos columnas */
        .dashboard {
            display: flex;
            gap: 15px;
            flex-wrap: wrap; /* Se apila en celulares */
        }

        .columna {
            flex: 1;
            min-width: 300px;
        }

        .titulo-linea {
            background: var(--rojo);
            font-size: 0.8em;
            padding: 5px 10px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* La Tarjeta (Fila) */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--gris);
            margin-bottom: 5px;
            padding: 8px 12px;
            display: flex;
            align-items: center; /* Alinea todo al centro vertical */
            justify-content: space-between; /* Texto a la izquierda, botones a la derecha */
        }

        .info {
            display: flex;
            flex-direction: column;
            max-width: 60%;
        }

        .pn { font-size: 0.6em; color: var(--rojo); font-family: monospace; }
        .nombre { font-size: 0.85em; font-weight: bold; }

        /* Contenedor de Botones y Número */
        .controles {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stock-num {
            font-size: 1.2em;
            font-weight: bold;
            min-width: 35px;
            text-align: center;
        }

        /* Botones Pequeños y Cuadrados */
        .btn {
            background: var(--gris);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active { background: var(--rojo); }

        /* Alerta de Stock Bajo */
        .bajo-stock { border-color: var(--rojo); }
        .bajo-stock .stock-num { color: var(--rojo); }

    </style>
</head>
<body>

    <div class="header">
        <h1>SISTEMA DE STOCK LEAR</h1>
    </div>

    <div class="dashboard">
        <div class="columna">
            <div class="titulo-linea">Línea X6S</div>
            <div id="lista-x6s"></div>
        </div>

        <div class="columna">
            <div class="titulo-linea">Línea KP1</div>
            <div id="lista-kp1"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBosJkUx7sKYz8AfJAG6-7Ln0jGbzbw_FU",
            authDomain: "gestion-stock-lear.firebaseapp.com",
            databaseURL: "https://gestion-stock-lear-default-rtdb.firebaseio.com",
            projectId: "gestion-stock-lear",
            storageBucket: "gestion-stock-lear.firebasestorage.app",
            messagingSenderId: "351720665066",
            appId: "1:351720665066:web:a54b5c3122960417bdcc93"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const modelos = [
            { id: "entry", pn: "L003351135NCPAA", desc: "KIT ENTRY 26", linea: "X6S", min: 420 },
            { id: "drive", pn: "L003351251NCPAA", desc: "KIT DRIVE 26", linea: "X6S", min: 420 },
            { id: "apb", pn: "L003411462NCPAA", desc: "KIT DRIVE APB 26", linea: "X6S", min: 200 },
            { id: "sdesign", pn: "L003351252NCPAA", desc: "TELA SDESIGN 26", linea: "X6S", min: 150 },
            { id: "n2", pn: "L004097919NCPAA", desc: "N2 KP1", linea: "KP1", min: 120 },
            { id: "bighorn", pn: "L003714499NCPAA", desc: "LL1 BIG HORN", linea: "KP1", min: 80 },
            { id: "rebel", pn: "L003714500NCPAA", desc: "LL2 REBEL", linea: "KP1", min: 50 },
            { id: "laramie", pn: "L003714501NCPAA", desc: "LL3 LARAMIE", linea: "KP1", min: 50 }
        ];

        function render() {
            modelos.forEach(m => {
                const html = `
                    <div class="card" id="card-${m.id}">
                        <div class="info">
                            <span class="pn">${m.pn}</span>
                            <span class="nombre">${m.desc}</span>
                        </div>
                        <div class="controles">
                            <button class="btn" onclick="cambiar('${m.id}', -1)">-</button>
                            <div class="stock-num" id="stock-${m.id}">0</div>
                            <button class="btn" onclick="cambiar('${m.id}', 1)">+</button>
                        </div>
                    </div>
                `;
                const container = m.linea === "X6S" ? 'lista-x6s' : 'lista-kp1';
                document.getElementById(container).innerHTML += html;
            });
        }

        window.cambiar = (id, cant) => {
            db.ref('stock/' + id).transaction(v => Math.max(0, (v || 0) + cant));
        };

        db.ref('stock').on('value', snap => {
            const data = snap.val() || {};
            modelos.forEach(m => {
                const val = data[m.id] || 0;
                const el = document.getElementById(`stock-${m.id}`);
                const card = document.getElementById(`card-${m.id}`);
                if(el) {
                    el.innerText = val;
                    val < m.min ? card.classList.add('bajo-stock') : card.classList.remove('bajo-stock');
                }
            });
        });

        render();
    </script>
</body>
</html>
